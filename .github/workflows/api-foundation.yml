name: API foundation

on:
  push:
    branches:
      - feat/d07-messaging-foundation
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package.json
      - name: Install API dependencies
        run: npm install --prefix apps/api
      - name: Typecheck API
        run: npm run typecheck --prefix apps/api
      - name: Build API
        run: npm run build --prefix apps/api
